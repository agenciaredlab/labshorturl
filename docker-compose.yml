# Para desarrollo local: docker compose up -d
# Para producción:       docker compose --env-file .env up -d
#
# Genera .env con:  node scripts/setup.js
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labshorturl
      POSTGRES_USER: labshorturl
      POSTGRES_PASSWORD: ${PG_PASSWORD:-labshorturl}
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labshorturl"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: labshorturl:latest
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV:       ${NODE_ENV:-production}
      PORT:           ${PORT:-3000}
      BASE_URL:       ${BASE_URL:-http://localhost:3000}
      ADMIN_USER:     ${ADMIN_USER:-admin}
      ADMIN_PASS:     ${ADMIN_PASS:-admin123}
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret-local}
      DATABASE_URL:   ${DATABASE_URL:-postgresql://labshorturl:labshorturl@db:5432/labshorturl}
      SENTRY_DSN:     ${SENTRY_DSN:-}
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  logs:
