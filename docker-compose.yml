# Para desarrollo local: docker compose up -d
version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labshorturl
      POSTGRES_USER: labshorturl
      POSTGRES_PASSWORD: labshorturl
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labshorturl"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: labshorturl:latest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      BASE_URL: http://localhost:3000
      ADMIN_USER: admin
      ADMIN_PASS: admin123              # Cambia en producción
      SESSION_SECRET: dev-secret-local  # Cambia en producción
      DATABASE_URL: postgresql://labshorturl:labshorturl@db:5432/labshorturl
    volumes:
      - logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pg_data:
  logs:
