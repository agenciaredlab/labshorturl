<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — LabShortURL</title>
  <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { font-family: 'Inter', sans-serif; }

    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .dark .gradient-bg { background: linear-gradient(135deg, #1a1730 0%, #12101e 100%); }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    input:focus { outline: none; box-shadow: 0 0 0 2px #a78bfa; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60%  { transform: translateX(-6px); }
      40%, 80%  { transform: translateX(6px); }
    }
    .shake { animation: shake 0.4s ease; }

    /* Dark mode */
    .dark .card { background: #1e1b2e !important; border: 1px solid #2d2a42; }
    .dark .card h1 { color: #f1f0fb; }
    .dark .card p  { color: #9ca3af; }
    .dark .card input {
      background: #2d2a42 !important;
      border-color: #3d3a52 !important;
      color: #f1f0fb !important;
    }
    .dark .card input::placeholder { color: #6b7280; }
    .dark .card label { color: #9ca3af; }
  </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center px-4">
  <div class="card bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full">

    <!-- Logo -->
    <div class="flex flex-col items-center mb-7">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center mb-3"
           style="background:linear-gradient(135deg,#667eea,#764ba2)">
        <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
          <path d="M14 18h8M20 14l4 4-4 4M16 14l-4 4 4 4" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold text-gray-800">LabShortURL</h1>
      <p class="text-gray-400 text-sm mt-1">Accede al panel de administración</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Usuario</label>
        <input id="userInput" type="text" placeholder="admin" autocomplete="username"
          class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm transition"
          required/>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Contraseña</label>
        <div class="relative">
          <input id="passInput" type="password" placeholder="••••••••" autocomplete="current-password"
            class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-12 text-sm transition"
            required/>
          <button type="button" onclick="togglePwd()" tabindex="-1"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="errorMsg" class="hidden text-red-500 text-sm bg-red-50 border border-red-200 rounded-xl px-3 py-2 text-center"></div>

      <button type="submit" id="submitBtn"
        class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm mt-1">
        Iniciar sesión
      </button>
    </form>
  </div>

  <script>
    // If already authenticated, go home
    fetch('/api/admin/me').then(r => { if (r.ok) window.location.href = '/'; });

    function togglePwd() {
      const inp = document.getElementById('passInput');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('userInput').value.trim();
      const password = document.getElementById('passInput').value;
      const btn      = document.getElementById('submitBtn');
      const errEl    = document.getElementById('errorMsg');

      btn.textContent = 'Verificando…';
      btn.disabled = true;
      errEl.classList.add('hidden');

      try {
        const res  = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errEl.textContent = data.error || 'Error al iniciar sesión';
          errEl.classList.remove('hidden');
          document.getElementById('passInput').classList.add('shake');
          setTimeout(() => document.getElementById('passInput').classList.remove('shake'), 400);
          document.getElementById('passInput').value = '';
          document.getElementById('passInput').focus();
        } else {
          window.location.href = '/';
        }
      } catch {
        errEl.textContent = 'Error de conexión. Intenta de nuevo.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
